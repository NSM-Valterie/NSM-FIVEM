# Execute from your existing local server.cfg after the normal server configuration.
# Listing stays on your PC. Gameplay ports remain unchanged.
sv_master1 "http://127.0.0.1:80/api/serverlist/ingress"
sv_master2 ""
sv_master3 ""
sv_listingIpOverride "127.0.0.1"

# IMPORTANT: the older server binary unconditionally also heartbeats to its
# compiled-in default master. Apply local-server-heartbeat.patch and rebuild
# to remove that remote heartbeat. This config alone does not suppress it.
# This file does NOT change ownership, ticket, sv_lan or gameplay settings.
