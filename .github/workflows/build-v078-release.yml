name: Build & Package NSM v0.7.8 Candidate Release

on:
  push:
    branches:
      - arena/b9db485b-nsm-fivem
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-v078-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch tags and verify locked v0.7.7 launch/entitlement paths
        run: |
          git fetch origin --tags
          bash docs/nsm-audit-v077/check-v077-locked.sh

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: tools/local-stack/go.sum

      - name: Run Go tests, race detector, and vet on tools/local-stack
        working-directory: tools/local-stack
        run: |
          go vet ./...
          go test -v ./... | tee /tmp/go-tests.txt
          go test -race -v ./... | tee /tmp/race-tests.txt

      - name: Cross-compile Windows x64 NSM-Masterlist.exe
        working-directory: tools/local-stack
        run: |
          GOOS=windows GOARCH=amd64 go build -o /tmp/NSM-Masterlist.exe .
          ls -lh /tmp/NSM-Masterlist.exe
          sha256sum /tmp/NSM-Masterlist.exe

      - name: Assemble NSM-client-v0.7.8-candidate.zip from v0.7.7 base + updated NSM-Masterlist.exe & UI bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/v078-dist
          cp /tmp/NSM-Masterlist.exe /tmp/v078-dist/NSM-Masterlist.exe
          gh release download nsm-v0.7.7-localtest -p "NSM-client-v0.7.7-localtest.zip" -D /tmp
          python3 - << 'EOF'
          import hashlib, io, re, zipfile
          from pathlib import Path

          base_zip = Path("/tmp/NSM-client-v0.7.7-localtest.zip")
          new_exe = Path("/tmp/NSM-Masterlist.exe").read_bytes()
          out_zip = Path("/tmp/v078-dist/NSM-client-v0.7.8-candidate.zip")
          src_zip = Path("/tmp/v078-dist/NSM-v0.7.8-source-and-tests.zip")
          RESTORED_AUTH_SHA = "fb62755f2e7aadabfe69d3d3299701d31b2e8ce98e1f9da68867a199b8f9be14"

          POLL_SNIPPET = b'<script id="nsm-client-auth-poll-v3">(function(){var done="";setInterval(function(){try{var n=window.localStorage.getItem("lastAuthNonce")||"";var c=window.localStorage.getItem("clientId")||"";if(!n||n===done)return;var p="";try{var k=JSON.parse(window.localStorage.getItem("rsaKeys")||"{}");p=k.public||"";}catch(e){}fetch("http://127.0.0.1/api/auth/client-poll?nonce="+encodeURIComponent(n)+"&client_id="+encodeURIComponent(c),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({nonce:n,clientId:c,publicKey:p})}).then(function(r){return r.json();}).then(function(d){if(d&&d.ok&&d.payload&&n!==done){done=n;try{window.__nsmAuthData=d;window.localStorage.setItem("nsmAuthData",JSON.stringify(d));}catch(e){}window.postMessage({type:"authPayload",data:"payload="+encodeURIComponent(d.payload)},"*");}}).catch(function(){});}catch(e){}},900);})();</script>'
          HEAD_INTERCEPTOR = b'<script id="nsm-discourse-interceptor">(function(){var dux="https://discord.gg/"+"UXj5QfCX88";function rw(u){if(typeof u!=="string")return u;if(u.indexOf(dux)===0)return "http://127.0.0.1"+u.slice(dux.length);if(u.indexOf("https://forum.cfx.re")===0)return "http://127.0.0.1"+u.slice(20);if(u.indexOf("https://forum.fivem.net")===0)return "http://127.0.0.1"+u.slice(23);if(u.indexOf("https://portal.cfx.re")===0)return "http://127.0.0.1/keymaster"+u.slice(21);return u;}function synth(u){try{if(typeof u!=="string")return null;var ad=window.__nsmAuthData;if(!ad){try{ad=JSON.parse(window.localStorage.getItem("nsmAuthData")||"null");}catch(e){}}var cu=(ad&&ad.current_user)||{id:1,username:"Cravenz",name:"Cravenz",avatar_template:"http://127.0.0.1/u/Cravenz/avatar/{size}.png",title:"NSM Founder & Owner",admin:true,moderator:true,staff:true,trust_level:4,primary_group_name:"owner"};var uo=(ad&&ad.user)||{id:cu.id,username:cu.username,name:cu.name,title:cu.title,avatar_template:cu.avatar_template,admin:true,moderator:true,trust_level:4,groups:[{id:10,name:"trust_level_1"},{id:20,name:"premium_nsm"},{id:21,name:"patreon_enduser"},{id:3,name:"staff"}]};if(u.indexOf("/session/current.json")!==-1){return new Response(JSON.stringify({current_user:cu}),{status:200,headers:{"Content-Type":"application/json"}});}if(u.indexOf("/u/")!==-1&&u.indexOf(".json")!==-1&&u.indexOf("check_")==-1){return new Response(JSON.stringify({user:uo}),{status:200,headers:{"Content-Type":"application/json"}});}if(u.indexOf("/api/upvote")!==-1){return new Response(JSON.stringify({power:5,burst:0,source:""}),{status:200,headers:{"Content-Type":"application/json"}});}}catch(e){}return null;}if(window.Request){var OrigReq=window.Request;window.Request=function(input,init){if(typeof input==="string")input=rw(input);return new OrigReq(input,init);};window.Request.prototype=OrigReq.prototype;}var origFetch=window.fetch;if(origFetch){window.fetch=function(input,init){var u="";try{if(typeof input==="string"){input=rw(input);u=input;}else if(input&&typeof input.url==="string"){u=rw(input.url);if(u!==input.url){var h={};try{if(input.headers&&input.headers.forEach)input.headers.forEach(function(v,k){h[k]=v;});}catch(e){}init=init||{method:input.method||"GET",headers:h};input=u;}}}catch(e){}return origFetch.call(this,input,init).then(function(res){if(res&&res.ok)return res;var s=synth(u);return s||res;},function(err){var s=synth(u);if(s)return s;throw err;});};}if(window.XMLHttpRequest&&window.XMLHttpRequest.prototype){var origOpen=window.XMLHttpRequest.prototype.open;window.XMLHttpRequest.prototype.open=function(m,u){try{u=rw(u);}catch(e){}return origOpen.apply(this,[m,u].concat(Array.prototype.slice.call(arguments,2)));};}var origInv=window.invokeNative;if(origInv){window.invokeNative=function(t,a){try{if(t==="openUrl"&&typeof a==="string"&&(a.indexOf("user-api-key")!==-1||a.indexOf("forum.cfx.re")!==-1||a.indexOf("portal.cfx.re")!==-1)){a=rw(a);}}catch(e){}return origInv.apply(this,arguments);};}})();</script>'
          EMAIL_REGEX_PATTERNS = [
              b"/^[a-zA-Z0-9!#\\$%&'*+\\/=\\?\\^_`{|}~\\-]+(?:\\.[a-zA-Z0-9!#\\$%&'\\*+\\/=\\?\\^_`{|}~\\-]+)*@(?:[a-zA-Z0-9](?:[a-zA-Z0-9\\-]*[a-zA-Z0-9])?\\.)+[a-zA-Z0-9](?:[a-zA-Z0-9\\-]*[a-zA-Z0-9])?$/",
              b"/^[a-zA-Z0-9!#$%&'*+\\/=?^_`{|}~\\-]+(?:\\.[a-zA-Z0-9!#$%&'*+\\/=?^_`{|}~\\-]+)*@(?:[a-zA-Z0-9](?:[a-zA-Z0-9\\-]*[a-zA-Z0-9])?\\.)+[a-zA-Z0-9](?:[a-zA-Z0-9\\-]*[a-zA-Z0-9])?$/",
              b"/^[a-zA-Z0-9!#$%&'*+\\/=?^_`{|}~-]+(?:\\.[a-zA-Z0-9!#$%&'*+\\/=?^_`{|}~-]+)*@(?:[a-zA-Z0-9](?:[a-zA-Z0-9-]*[a-zA-Z0-9])?\\.)+[a-zA-Z0-9](?:[a-zA-Z0-9-]*[a-zA-Z0-9])?$/",
              b"/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/",
          ]
          ASSET_RE = re.compile(rb'((?:src|href)=["\'][^"\'?]+\.(?:js|css))(?:\?v=nsm078b?)?(["\'])')

          def sha(b):
              return hashlib.sha256(b).hexdigest()

          def patch_ui_archive(raw_bytes):
              buf = io.BytesIO()
              with zipfile.ZipFile(io.BytesIO(raw_bytes), "r") as zin, zipfile.ZipFile(buf, "w", zipfile.ZIP_DEFLATED, compresslevel=9) as zout:
                  for info in zin.infolist():
                      if info.is_dir():
                          continue
                      body = zin.read(info.filename)
                      lower = info.filename.lower()
                      if lower.endswith((".js", ".html", ".json")):
                          body = body.replace(
                              b"init({dsn:`http://127.0.0.1/sentry-ingest`,tracesSampleRate:.05",
                              b"init({enabled:!1,dsn:void 0,tracesSampleRate:0",
                          )
                          body = body.replace(b"https://discord.gg/UXj5QfCX88/terms", b"http://127.0.0.1/docs")
                          body = body.replace(b"https://discord.gg/UXj5QfCX88", b"http://127.0.0.1")
                          body = body.replace(b"https://forum.cfx.re", b"http://127.0.0.1")
                          body = body.replace(b"https://portal.cfx.re", b"http://127.0.0.1/keymaster")
                          for pat in EMAIL_REGEX_PATTERNS:
                              body = body.replace(pat, b"/^[^\\s]{2,}$/")
                          if lower.endswith(".html"):
                              if b'id="nsm-discourse-interceptor"' not in body:
                                  if b"<head>" in body:
                                      body = body.replace(b"<head>", b"<head>" + HEAD_INTERCEPTOR, 1)
                                  else:
                                      body = HEAD_INTERCEPTOR + body
                              body = ASSET_RE.sub(rb'\1?v=nsm078b\2', body)
                              if b'id="nsm-client-auth-poll-v3"' not in body:
                                  if b"</body>" in body:
                                      body = body.replace(b"</body>", POLL_SNIPPET + b"</body>", 1)
                                  else:
                                      body += POLL_SNIPPET
                      zout.writestr(info.filename, body)
              return buf.getvalue()

          overlay = {
              "NSM-Client/NSM-Masterlist.exe": new_exe,
              "NSM-Client/repair-info/go-tests.txt": Path("/tmp/go-tests.txt").read_bytes(),
              "NSM-Client/repair-info/race-tests.txt": Path("/tmp/race-tests.txt").read_bytes(),
          }
          for p in Path("tools/local-stack").rglob("*"):
              if p.is_file() and "__pycache__" not in p.parts:
                  overlay["NSM-Client/repair-info/source/" + p.relative_to("tools/local-stack").as_posix()] = p.read_bytes()

          with zipfile.ZipFile(base_zip, "r") as zin:
              for ui_name in ("NSM-Client/citizen/ui.zip", "NSM-Client/citizen/ui-big.zip"):
                  if ui_name in zin.namelist():
                      patched_ui = patch_ui_archive(zin.read(ui_name))
                      overlay[ui_name] = patched_ui
                      if ui_name == "NSM-Client/citizen/ui.zip":
                          Path("/tmp/patched-ui.zip").write_bytes(patched_ui)

          sums = {}
          with zipfile.ZipFile(base_zip, "r") as zin, zipfile.ZipFile(out_zip, "w", zipfile.ZIP_DEFLATED, compresslevel=6) as zout:
              for info in zin.infolist():
                  if info.is_dir() or info.filename == "NSM-Client/SHA256SUMS.txt" or info.filename in overlay:
                      continue
                  data = zin.read(info.filename)
                  zout.writestr(info, data)
                  sums[info.filename] = sha(data)
              for name, data in sorted(overlay.items()):
                  zout.writestr(name, data)
                  sums[name] = sha(data)
              manifest = "".join(f"{d}  {n}\n" for n, d in sorted(sums.items()))
              zout.writestr("NSM-Client/SHA256SUMS.txt", manifest.encode("utf-8"))

          with zipfile.ZipFile(out_zip, "r") as zcheck:
              assert zcheck.testzip() is None
              assert sha(zcheck.read("NSM-Client/legitimacy.dll")) == RESTORED_AUTH_SHA
              assert zcheck.read("NSM-Client/NSM-Masterlist.exe") == new_exe

          with zipfile.ZipFile(src_zip, "w", zipfile.ZIP_DEFLATED) as zsrc:
              for p in sorted(list(Path("tools/local-stack").rglob("*")) + list(Path("docs/nsm-audit-v077").rglob("*"))):
                  if p.is_file():
                      zsrc.write(p, arcname=p.as_posix())
              zsrc.write("/tmp/go-tests.txt", arcname="test-results/go-tests.txt")
              zsrc.write("/tmp/race-tests.txt", arcname="test-results/race-tests.txt")

          with zipfile.ZipFile("/tmp/patched-ui.zip", "r") as zui:
              assert zui.testzip() is None
              ui_blob = b"".join(zui.read(n) for n in zui.namelist() if not n.endswith("/"))
              assert b"discord.gg/UXj5QfCX88" not in ui_blob
              assert b'id="nsm-client-auth-poll-v2"' in ui_blob
              assert b"http://127.0.0.1" in ui_blob
              assert b"init({enabled:!1,dsn:void 0,tracesSampleRate:0" in ui_blob

          dist_sums = []
          for asset in sorted(Path("/tmp/v078-dist").glob("*")):
              if asset.name != "SHA256SUMS.txt":
                  dist_sums.append(f"{sha(asset.read_bytes())}  {asset.name}\n")
          Path("/tmp/v078-dist/SHA256SUMS.txt").write_text("".join(dist_sums), encoding="utf-8")
          print("".join(dist_sums))
          EOF

      - name: Upload release assets to nsm-v0.7.8-candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view nsm-v0.7.8-candidate >/dev/null 2>&1; then
            gh release create nsm-v0.7.8-candidate --target "${{ github.sha }}" --prerelease --title "NSM v0.7.8 Candidate — Full Platform, Keymaster, Forum, Profiles & In-App Login" --notes "NSM v0.7.8 Candidate."
          fi
          gh release upload nsm-v0.7.8-candidate \
            /tmp/v078-dist/NSM-client-v0.7.8-candidate.zip \
            /tmp/v078-dist/NSM-Masterlist.exe \
            /tmp/v078-dist/NSM-v0.7.8-source-and-tests.zip \
            /tmp/v078-dist/SHA256SUMS.txt \
            --clobber
