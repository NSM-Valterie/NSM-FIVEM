name: P2 stock build

on:
  workflow_dispatch:
    inputs:
      product:
        description: 'Product to build (fxserver = server, fivem = client)'
        required: true
        default: 'fxserver'
        type: choice
        options:
          - fxserver
          - fivem
          - fxserver-linux
          - crt

concurrency:
  group: p2-build-${{ inputs.product }}
  cancel-in-progress: true

jobs:
  build:
    if: inputs.product != 'fxserver-linux'
    runs-on: windows-2022
    timeout-minutes: 350
    env:
      CI: 'true'
      CFX_DRY_RUN: 'true'
      CFX_PRODUCT_NAME: ${{ inputs.product }}
      CI_COMMIT_REF_NAME: ${{ github.ref_name }}
      CI_COMMIT_SHA: ${{ github.sha }}
      CI_PROJECT_DIR: ${{ github.workspace }}
    steps:
      - name: Enable git symlinks
        run: git config --global core.symlinks true

      - name: Checkout
        if: inputs.product != 'crt'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # submodules are cloned by the Cfx CI script itself (shallow, tag-aware)

      - name: Materialize repo symlinks as junctions
        if: inputs.product != 'crt'
        shell: pwsh
        run: |
          $links = git ls-files -s | Where-Object { $_ -match '^120000' }
          foreach ($l in $links) {
            $parts = $l -split '\s+'
            $path = ($parts[3] -replace '^"', '' -replace '"$', '')
            $target = (git cat-file -p $parts[1]).Trim()
            $linkDir = Split-Path $path -Parent
            $absTarget = Resolve-Path (Join-Path $linkDir $target) -ErrorAction SilentlyContinue
            if ($absTarget) {
              $item = Get-Item $path -Force -ErrorAction SilentlyContinue
              if (-not $item.LinkType) {
                Remove-Item $path -Force
                New-Item -ItemType Junction -Path $path -Target $absTarget.Path | Out-Null
                Write-Host "junction: $path -> $($absTarget.Path)"
              }
            } else { Write-Host "WARN: symlink target missing for $path ($target)" }
          }

      - name: Install MSYS2 (pacman needed by prebuild)
        if: inputs.product != 'crt'
        run: choco install -y msys2 --params "/InstallDir:C:\msys64"

      - name: Python setuptools for every Python (node-gyp needs distutils)
        if: inputs.product != 'crt'
        shell: pwsh
        run: |
          $pythons = @()
          $cmd = Get-Command python -ErrorAction SilentlyContinue
          if ($cmd) { $pythons += $cmd.Source }
          $pythons += (& py -0p 2>$null | ForEach-Object { ($_ -split '\s+')[-1] } | Where-Object { $_ -like '*python.exe' })
          $pythons | Select-Object -Unique | ForEach-Object {
            Write-Host "setuptools -> $_"
            & $_ -m pip install --quiet setuptools
            if ($LASTEXITCODE -ne 0) { Write-Host "WARN: setuptools install failed for $_" }
          }

      - name: Ensure yarn (system resources build)
        if: inputs.product != 'crt'
        run: npm install -g yarn

      - name: Fetch toolset CRT
        if: inputs.product == 'crt'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsdir = & $vswhere -latest -prerelease -property installationPath -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64
          Write-Host "VS install: $vsdir"
          $toolset = (Get-ChildItem (Join-Path $vsdir 'VC\Tools\MSVC') | Sort-Object Name -Descending | Select-Object -First 1).Name
          Write-Host "toolset: $toolset"
          $redistRoot = Join-Path $vsdir 'VC\Redist\MSVC'
          Get-ChildItem $redistRoot -Recurse -Depth 3 | ForEach-Object { Write-Host "REDIST-TREE $($_.FullName)" }
          $crtDir = $null
          $probe = Get-ChildItem $redistRoot -Recurse -Filter msvcp140.dll -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '(^|\\)x64([^A-Za-z]|$)' -and $_.FullName -notmatch 'debug_nonredist|onecore|arm64' } |
            Sort-Object { [version](($_.VersionInfo.FileVersion -split ' ')[0]) } -Descending |
            Select-Object -First 1
          if ($probe) { $crtDir = $probe.Directory.FullName }
          if (!$crtDir) { throw "no msvcp140.dll found under $redistRoot" }
          $redistVer = [version](($probe.VersionInfo.FileVersion -split ' ')[0])
          $toolsetVer = [version]($toolset + '.0')
          if ($redistVer -lt [version]::new($toolsetVer.Major, $toolsetVer.Minor, 0, 0)) { throw "redist $redistVer older than toolset $toolset" }
          Write-Host "CRT dir: $crtDir"
          New-Item -ItemType Directory -Force -Path crt-output | Out-Null
          Get-ChildItem $crtDir -Filter *.dll | ForEach-Object {
            Write-Host "CRT $($_.Name) $($_.VersionInfo.FileVersion) $($_.Length)"
            Copy-Item $_.FullName -Destination crt-output
          }

      - name: Upload toolset CRT
        if: inputs.product == 'crt'
        uses: actions/upload-artifact@v4
        with:
          name: toolset-crt
          path: crt-output/
          retention-days: 7
          if-no-files-found: error

      - name: Build (upstream Cfx CI script)
        if: inputs.product != 'crt'
        shell: pwsh
        run: |
          Set-Location code/tools/ci
          if ('${{ inputs.product }}' -eq 'fivem') { Write-Host '=== running build_client.ps1 ==='; & .\build_client.ps1 }
          else { Write-Host '=== running build_server_windows.ps1 ==='; & .\build_server_windows.ps1 }

      - name: Upload binaries and caches (always)
        if: always() && inputs.product != 'crt'
        uses: actions/upload-artifact@v4
        with:
          name: p2-${{ inputs.product }}-output
          path: |
            .build-cache/bin/
            caches/
          retention-days: 7
          if-no-files-found: warn

  build-linux:
    if: inputs.product == 'fxserver-linux'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Build the upstream Cfx Alpine builder image
        run: |
          mkdir -p /tmp/ctx/code/tools/ci/docker-builder
          cp code/tools/ci/docker-builder/Dockerfile /tmp/ctx/code/tools/ci/docker-builder/
          cp code/tools/ci/docker-builder/proot_prepare.sh /tmp/ctx/code/tools/ci/docker-builder/
          docker build -f /tmp/ctx/code/tools/ci/docker-builder/Dockerfile -t nsm-builder /tmp/ctx

      - name: Build Linux server (upstream Cfx recipe)
        run: |
          docker run --rm -v "$PWD:/build/fivem" -w /build/fivem \
            -e CI=true -e CFX_DRY_RUN=true -e CFX_PRODUCT_NAME=fxserver \
            -e CI_COMMIT_REF_NAME="$GITHUB_REF_NAME" -e CI_COMMIT_SHA="$GITHUB_SHA" \
            -e CI_PIPELINE_ID="$GITHUB_RUN_ID" \
            nsm-builder sh -c "mkdir -p /builds && sh code/tools/ci/build_server_docker_alpine.sh"

      - name: Upload Linux server artifact (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-fxserver-linux-output
          path: |
            fx.tar.xz
            caches/
          retention-days: 7
          if-no-files-found: warn
